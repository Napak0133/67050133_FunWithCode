<!DOCTYPE html>
<html>
<head>
    <title>Exercise05</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        td {
            height: 100px;
            border: 1px solid black;
        }
        .first {
            background-color: #c5cc7a;
        }
        .second {
            background-color: #f8bda8;
        }
    </style>
</head>
<body>

<table>
    <tr>
        <td class="first">First cell</td>
        <td class="second">Second cell</td>
    </tr>
</table>

</body>
</html>
