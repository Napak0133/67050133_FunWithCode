<!DOCTYPE html>
<html>
<head>
    <title>Exercise06</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        td {
            height: 100px;
            border: 1px solid black;
            padding: 10px;
        }

        .first {
            background-color: #c5cc7a;
        }

        .second {
            background-color: #f8bda8;
        }
    </style>
</head>
<body>

<table>
    <tr>
        <td class="first">First cell</td>
        <td class="second">Second cell</td>
    </tr>
</table>

</body>
</html>
